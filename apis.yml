name: Tripwire
description: 'Tripwire Inc. (part of Fortra), headquartered in Portland, Oregon, is an
  enterprise cybersecurity company known for file integrity monitoring (FIM), security
  configuration management (SCM), and vulnerability management. Its product line includes
  Tripwire Enterprise, the Tripwire Axon Agent, Tripwire IP360, Tripwire ExpertOps, and
  the original Open Source Tripwire. Tripwire''s capabilities are delivered as on-premises
  and managed products with product-embedded REST APIs and configuration-management
  integrations (Puppet, Chef, Ansible) rather than a public developer portal; there is no
  public developer portal, public OpenAPI, or first-party client SDK on the public package
  registries as of this enrichment pass. This profile was surfaced as a portfolio company
  of bessemer-venture-partners and is being enriched by the API Evangelist pipeline.'
